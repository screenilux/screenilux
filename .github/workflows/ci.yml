# Checks every pull request into main on Windows and Linux, and releases every
# merge into it with a download for each.

name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request makes the older run pointless. Runs
# on main always finish, so no merge goes unreleased.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned so a new Rust release cannot fail the build with new lints on its
  # own. Raise it deliberately, alongside the code it needs.
  RUST_TOOLCHAIN: "1.99.1"
  CARGO_TERM_COLOR: always
  # What the Linux backend builds against, and what its tests run: GStreamer
  # with its encoders, a virtual X display, and Tesseract.
  LINUX_PACKAGES: >-
    libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
    gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad
    gstreamer1.0-plugins-ugly gstreamer1.0-libav
    libxkbcommon-dev libgtk-3-dev xvfb tesseract-ocr

jobs:
  check:
    name: Check and test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Hosted runners have no GPU, display, microphone or camera. These
      # crates' tests use fakes or skip what is missing; the capture,
      # encoder, decoder and player tests need the real thing and run
      # locally with `cargo test --workspace`.
      - name: Tests that need no screen or GPU
        run: cargo test --locked -p screenilux-core -p screenilux-recorder -p screenilux-share -p screenilux

      - name: Every other test still compiles
        run: cargo test --workspace --locked --no-run

  check-linux:
    name: Check and test (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $LINUX_PACKAGES

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # A virtual X display is enough for the Linux backend's own tests:
      # capture, thumbnails, the input hook, encoding, decoding, text.
      - name: Tests on a virtual display
        run: xvfb-run -a -s "-screen 0 1920x1080x24" cargo test --workspace --locked

  check-web:
    name: Check and build (web player)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - name: Types
        run: npm run check
      - name: Build
        run: npm run build

  build-windows:
    name: Build (Windows)
    needs: [check, check-linux]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p screenilux

      # The executable keeps its name inside the zip: Windows files the
      # "Open with" entry under it.
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/screenilux | Out-Null
          Copy-Item target/release/screenilux.exe, README.md, LICENSE dist/screenilux
          Compress-Archive -Path dist/screenilux/* -DestinationPath dist/windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/windows-x64.zip

  build-linux:
    name: Build (Linux)
    needs: [check, check-linux]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $LINUX_PACKAGES

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p screenilux

      - name: Package
        run: |
          mkdir -p dist/screenilux
          cp target/release/screenilux README.md LICENSE dist/screenilux/
          tar -czf dist/linux-x64.tar.gz -C dist screenilux

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist/linux-x64.tar.gz

  release:
    name: Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Name the downloads
        id: files
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          tag="v$version-build.${{ github.run_number }}"
          mkdir dist
          cp artifacts/windows-x64/windows-x64.zip "dist/screenilux-$tag-windows-x64.zip"
          cp artifacts/linux-x64/linux-x64.tar.gz "dist/screenilux-$tag-linux-x64.tar.gz"
          (cd dist && sha256sum screenilux-* > SHA256SUMS.txt)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.files.outputs.tag }}
          VERSION: ${{ steps.files.outputs.version }}
        run: |
          # A re-run of the same workflow run replaces the files rather than
          # failing on a release that already exists.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --target "${{ github.sha }}" \
              --title "Screenilux $VERSION (build ${{ github.run_number }})" \
              --generate-notes
          fi

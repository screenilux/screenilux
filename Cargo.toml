[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/platform",
    "crates/win",
    "crates/linux",
    "crates/recorder",
    "crates/player",
    "crates/share",
    "crates/export",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/screenilux/screenilux"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
crossbeam-channel = "0.5.17"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Core does per-pixel work on every frame a recording takes (colour conversion,
# effects), and unoptimised it is ten to fifteen times slower: 50ms a 1080p
# frame, past the 33ms a frame gets at 30fps. Optimised here so a debug build
# and the tests record in real time like a release does.
[profile.dev.package.screenilux-core]
opt-level = 3

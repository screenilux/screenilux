[package]
name = "screenilux-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The operating system for Screenilux, behind one set of names: Windows or Linux, picked at compile time."

[target.'cfg(windows)'.dependencies]
screenilux-win = { path = "../win" }

[target.'cfg(target_os = "linux")'.dependencies]
screenilux-linux = { path = "../linux" }

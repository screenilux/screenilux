[package]
name = "screenilux"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Screen recorder for Windows and Linux."

[[bin]]
name = "screenilux"
path = "src/main.rs"

[dependencies]
screenilux-core = { path = "../core" }
screenilux-player = { path = "../player" }
screenilux-recorder = { path = "../recorder" }
screenilux-platform = { path = "../platform" }
eframe = "0.37"
egui = "0.37"
raw-window-handle = "0.6"
rfd = "0.17"
tiny-skia = "0.12"
tracing = { workspace = true }
tracing-subscriber = "0.3"

[build-dependencies]
tiny-skia = "0.12"
winresource = "0.1"
